<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Connexa Console{% endblock %}</title>
  <style>
    :root { --ink:#15202b; --muted:#5a6b7f; --panel:#ffffff; --bg:#f2f5f9; --accent:#3b5bdb; --ok:#2b8a3e; --bad:#c92a2a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--ink); color:#fff; padding:10px 28px; display:flex; align-items:center; gap:18px; }
    header .brand { font-weight:700; letter-spacing:.5px; font-size:18px; }
    header .brand span { color:#8ba3ff; }
    header nav a { color:#cdd5df; text-decoration:none; margin-right:16px; font-size:14px; }
    header nav a:hover { color:#fff; }
    header .spacer { flex:1; }
    main { max-width:1060px; margin:26px auto 60px; padding:0 20px; }
    h1 { font-size:22px; margin:18px 0 6px; }
    h2 { font-size:16px; margin:26px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
    .cards { display:flex; gap:14px; flex-wrap:wrap; margin:16px 0 8px; }
    .card { background:var(--panel); border-radius:12px; padding:16px 20px; min-width:150px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .card .num { font-size:26px; font-weight:700; }
    .card .lbl { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); font-size:13.5px; }
    th { text-align:left; padding:9px 12px; background:#eaf0f6; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
    td { padding:9px 12px; border-top:1px solid #eef2f6; vertical-align:top; }
    code, .code { font-family:Consolas,Menlo,monospace; background:#eef3fb; padding:1px 6px; border-radius:5px; font-size:12.5px; }
    code.big { display:block; padding:10px 14px; font-size:13px; background:#0f1720; color:#9ad1ff; border-radius:8px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; }
    form.inline { display:inline; }
    input[type=text], input[type=url], select { padding:8px 10px; border:1px solid #ccd6e0; border-radius:8px; font-size:14px; min-width:220px; }
    button, .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 15px; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
    button.secondary { background:#5a6b7f; }
    button.small { padding:4px 10px; font-size:12.5px; }
    .muted { color:var(--muted); font-size:12.5px; }
    .flash { background:#e7f8ed; border:1px solid #b7e4c7; padding:12px 16px; border-radius:10px; margin:12px 0; }
    .flash .note { font-size:12.5px; color:var(--muted); margin-top:6px; }
    .pill { padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; }
    .pill.ok { background:#d3f9d8; color:#2b8a3e; } .pill.no { background:#ffe3e3; color:#c92a2a; }
    .pill.mid { background:#fff3bf; color:#a38000; }
  </style>
</head>
<body>
<header>
  <div class="brand">connexa<span>console</span></div>
  <nav>
    <a href="/dashboard">Overview</a>
    <a href="/dashboard/accounts">Linked Accounts</a>
    <a href="/dashboard/link">Link &amp; Data</a>
    <a href="/dashboard/keys">API Keys</a>
    <a href="/dashboard/webhooks">Webhooks</a>
    <a href="/dashboard/audit">Audit Trail</a>
    <a href="/dashboard/agents">Agent Handler</a>
    <a href="/dashboard/gateway">Gateway</a>
    <a href="/dashboard/workforce">Workforce</a>
  </nav>
  <div class="spacer"></div>
  <a href="/docs" style="color:#cdd5df;font-size:14px;text-decoration:none;">API docs ↗</a>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
